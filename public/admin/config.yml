# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Sveltia uses the GitHub repository to load and save CMS-managed content.
backend:
  name: github
  repo: seegodesign/a.gaut
  branch: main

# New uploads are committed here and served by Astro from `/uploads/...`.
media_folder: /public/uploads
public_folder: /uploads

media_libraries:
  default:
    config:
      slugify_filename: true

singletons:
  - name: site
    label: Site Identity
    icon: settings
    file: /src/content/site.json
    format: json
    fields:
      - name: siteTitle
        label: Site Title
        widget: string
        required: true
        hint: The title of the site, shown in the browser tab and search results.
      - name: headline
        label: Homepage Headline
        widget: string
        required: false
        hint: Optional visible headline for the homepage. Leave blank to use the Site Title.
      - name: subhead
        label: Subhead
        widget: string
        required: false
        hint: The large lines of text shown in the background of the gallery.
      - name: animateSubhead
        label: Animate Subhead
        widget: boolean
        default: true
        required: false
        hint: Reveal the subhead one character at a time when the gallery loads. Turn this off to show it immediately.
      - name: instagramUrl
        label: Instagram URL
        widget: string
        required: true
        default: https://www.instagram.com/a_gaut
        hint: The full URL opened by the Instagram icon in the site header.

  - name: appearance
    label: Appearance
    icon: palette
    file: /src/content/appearance.json
    format: json
    fields:
      - name: googleFontFamily
        label: Google Font Family
        widget: string
        required: false
        default: Montserrat
        hint: Enter the exact family name from fonts.google.com, such as Montserrat, Roboto Mono, or Playfair Display. Leave blank to use the site's fallback font.
      - name: overheadLight
        label: Overhead Light
        widget: object
        collapsed: true
        hint: The soft light centered above the page.
        fields:
          - name: color
            label: Color
            widget: color
            default: '#ffffff'
          - name: opacity
            label: Opacity (%)
            widget: number
            value_type: int
            default: 98
            min: 0
            max: 100
            step: 1
            hint: 0 is fully transparent; 100 is fully opaque.
      - name: edgeVignette
        label: Edge Vignette
        widget: object
        collapsed: true
        hint: The subtle color darkening around the outer edges.
        fields:
          - name: color
            label: Color
            widget: color
            default: '#cfccc2'
          - name: opacity
            label: Opacity (%)
            widget: number
            value_type: int
            default: 16
            min: 0
            max: 100
            step: 1
            hint: 0 is fully transparent; 100 is fully opaque.
      - name: gradientTop
        label: Gradient Top
        widget: object
        collapsed: true
        fields:
          - name: color
            label: Color
            widget: color
            default: '#fafaf8'
          - name: opacity
            label: Opacity (%)
            widget: number
            value_type: int
            default: 100
            min: 0
            max: 100
            step: 1
            hint: 0 is fully transparent; 100 is fully opaque.
      - name: gradientMiddle
        label: Gradient Middle
        widget: object
        collapsed: true
        fields:
          - name: color
            label: Color
            widget: color
            default: '#f7f7f4'
          - name: opacity
            label: Opacity (%)
            widget: number
            value_type: int
            default: 100
            min: 0
            max: 100
            step: 1
            hint: 0 is fully transparent; 100 is fully opaque.
      - name: gradientBottom
        label: Gradient Bottom
        widget: object
        collapsed: true
        fields:
          - name: color
            label: Color
            widget: color
            default: '#deddd3'
          - name: opacity
            label: Opacity (%)
            widget: number
            value_type: int
            default: 100
            min: 0
            max: 100
            step: 1
            hint: 0 is fully transparent; 100 is fully opaque.

  - name: metadata
    label: Search & Sharing
    icon: public
    file: /src/content/seo-social.json
    format: json
    fields:
      - name: seoTitle
        label: SEO Title
        widget: string
        required: false
        hint: The homepage title shown in browser tabs, search results, and social previews. Defaults to Site Title.
      - name: seoDescription
        label: SEO Description
        widget: text
        required: false
        hint: A concise homepage summary for search engines and social previews. Aim for about 150 characters.
      - name: socialImage
        label: Social Share Image
        widget: image
        required: false
        hint: Optional image used when the site is shared. A 1200 × 630 JPG or PNG works best.
      - name: socialImageAlt
        label: Social Image Description
        widget: string
        required: false
        hint: A short description of the social share image for accessibility.

  - name: contact_page
    label: Contact Page
    icon: contact_page
    file: /src/content/contact.json
    format: json
    fields:
      - name: representationPrefix
        label: Representation Prefix
        widget: string
        required: true
        default: Represented by
        hint: Text shown immediately before the linked agency name.
      - name: representationName
        label: Agency Name
        widget: string
        required: true
        default: EDGE REPS
      - name: representationUrl
        label: Agency URL
        widget: string
        required: true
        default: http://www.edgereps.com/
      - name: email
        label: Email Address
        widget: string
        required: true
        default: adrian@agaut.com

collections:
  - name: gallery
    label: Gallery
    icon: photo_library
    files:
      - name: images
        label: Gallery Images
        file: /src/content/gallery.json
        format: json
        fields:
          - name: images
            label: Gallery Images
            label_singular: Image
            widget: list
            min: 1
            collapsed: true
            allow_reorder: true
            thumbnail: image
            hint: Drag images by their reorder handle to set the order used by the gallery.
            fields:
              - name: image
                label: Image
                widget: image
              - name: caption
                label: Project Caption
                widget: string
                required: false
                hint: Optional text shown near the bottom edge when this image is opened.
      - name: behavior
        label: Gallery Behavior
        file: /src/content/gallery-settings.json
        format: json
        fields:
          - name: randomizePhotoOrder
            label: Randomize Photo Order
            widget: boolean
            default: false
            required: false
            hint: Ignore the curated gallery order and shuffle the photos whenever the site loads.
          - name: enableAutoScroll
            label: Auto-Scroll Gallery
            widget: boolean
            default: false
            required: false
            hint: Let the mouse position control automatic gallery movement. The left and right sides set direction, and distance from the center sets speed.
          - name: autoScrollSpeed
            label: Auto-Scroll Speed
            widget: number
            value_type: int
            default: 48
            min: 5
            max: 200
            step: 1
            required: false
            hint: Maximum horizontal speed in pixels per second when the mouse is near either edge. Higher values move the gallery faster.
          - name: enablePhotoFloating
            label: Floating Photo Effect
            widget: boolean
            default: true
            required: false
            hint: Let photos drift gently and lift on hover. Turn this off to keep them still.
          - name: enableDepthDarkening
            label: Depth-Based Darkening
            widget: boolean
            default: false
            required: false
            hint: Progressively darken photographs as they sit farther from the camera.
          - name: enableDepthOfField
            label: Depth of Field Effect
            widget: boolean
            default: true
            required: false
            hint: Blur out-of-focus photos on larger screens. Turn this off to remove depth blur.
          - name: bokehStrength
            label: Bokeh Strength
            widget: number
            value_type: float
            default: 2.2
            min: 0
            max: 10
            step: 0.1
            required: false
            hint: Controls the intensity of out-of-focus blur. Has no effect when Depth of Field is turned off.
          - name: backgroundOverlayOpacity
            label: Background Overlay Opacity
            widget: number
            value_type: float
            default: 0.9
            min: 0
            max: 1
            step: 0.05
            required: false
            hint: Controls how dark the background and inactive photos become when a photo is opened. Use 0 for no darkening and 1 for black.
          - name: enableScrollMotionBlur
            label: Scroll Motion Blur
            widget: boolean
            default: true
            required: false
            hint: Soften photos slightly during fast scrolling to make their movement feel smoother.
          - name: enableCarouselEdgeFade
            label: Carousel Edge Fade
            widget: boolean
            default: true
            required: false
            hint: Fade photos near the left and right screen edges so they transition more softly into the carousel loop.
